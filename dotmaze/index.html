<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>닷 미로 · DOT MAZE</title>
<style>
  :root{ --accent:#FF4F00; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#eaf6ff;overflow:hidden;}

  /* 배경: 지금은 어두운 그라데이션. assets/bg.webp 주시면 center/cover 로 넣습니다. */
  .stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:10px 10px 12px;gap:8px;overflow:hidden;
    background:linear-gradient(rgba(12,7,2,.5),rgba(12,7,2,.66)),#1a1206 url('./assets/bg.webp') center/cover no-repeat;}

  .status{position:relative;z-index:5;flex:0 0 auto;margin-top:2px;
    background:rgba(14,10,4,.9);border:2px solid rgba(0,220,255,.55);border-radius:16px;color:#f4efe2;
    padding:9px 18px;font-size:clamp(14px,2.6vmin,20px);font-weight:800;white-space:nowrap;max-width:94%;
    display:flex;align-items:center;gap:10px;box-shadow:0 0 18px rgba(0,200,255,.3),0 6px 18px -6px rgba(0,0,0,.75);}
  .status .dot{width:12px;height:12px;border-radius:50%;background:#7fd9e0;flex:0 0 auto;}
  .status[data-phase="play"] .dot{background:#00d5ff;}
  .status[data-phase="over"] .dot{background:#2ecc71;}

  .hud{position:relative;z-index:5;flex:0 0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;
    background:rgba(14,10,4,.82);border:1.5px solid rgba(0,220,255,.45);border-radius:999px;padding:8px 18px;font-size:clamp(13px,2.2vmin,17px);font-weight:800;color:#f4efe2;max-width:94%;box-shadow:0 0 16px rgba(0,200,255,.22);}
  .hud b{color:#8fe8ff;}
  .hud-sep{color:#7a684a;}

  .maze-area{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;}
  .maze{width:min(94vw,78vh,620px);aspect-ratio:15/11;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(11,1fr);
    background:rgba(18,12,6,.5);padding:min(1.4vmin,9px);border-radius:16px;border:2px solid rgba(0,220,255,.5);
    box-shadow:0 0 30px rgba(0,200,255,.3),inset 0 0 34px rgba(255,160,60,.1),0 16px 40px -16px rgba(0,0,0,.9);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
  .mz{position:relative;}
  /* 벽: 석재+시안 회로 벽돌 타일 4종을 위치별로 번갈아 배치(단조로움 방지) */
  .mz.wall{background-size:cover;background-position:center;border-radius:3px;
    box-shadow:inset 0 0 0 1px rgba(0,225,255,.35),0 1px 2px rgba(0,0,0,.5);}
  .mz.wall.w1{background-image:url('./assets/wall1.webp');}
  .mz.wall.w2{background-image:url('./assets/wall2.webp');}
  .mz.wall.w3{background-image:url('./assets/wall3.webp');}
  .mz.wall.w4{background-image:url('./assets/wall4.webp');}
  .mz.player{overflow:visible;z-index:6;}
  /* 플레이어: 탐험가 캐릭터가 칸 바닥에 서 있는 형태 */
  .mz.player::after{content:"";position:absolute;left:50%;bottom:4%;transform:translateX(-50%);
    width:118%;height:188%;background:url('./assets/player.webp') bottom center/contain no-repeat;
    filter:drop-shadow(0 0 5px rgba(255,190,80,.9)) drop-shadow(0 2px 3px rgba(0,0,0,.55));pointer-events:none;}
  /* 출구: 마젠타 게이트 링(이미지의 핑크 액센트) */
  .mz.goal::after{content:"";position:absolute;inset:11%;border-radius:5px;border:2.5px solid #ff5ad6;
    box-shadow:0 0 16px rgba(255,90,214,.85),inset 0 0 9px rgba(255,90,214,.45);}
  .mz.goal.player::after{border:none;border-radius:0;inset:auto;left:50%;bottom:4%;transform:translateX(-50%);
    width:118%;height:188%;background:url('./assets/player.webp') bottom center/contain no-repeat;box-shadow:none;
    filter:drop-shadow(0 0 6px rgba(255,90,214,.9));}

  .controls{position:relative;z-index:6;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:9px;max-width:96vw;}
  .ctl-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;}
  .btn{font-family:inherit;font-size:clamp(12px,1.9vmin,15px);font-weight:800;border-radius:13px;border:0;cursor:pointer;
    background:rgba(255,255,255,.95);color:#181a3a;box-shadow:0 5px 13px -6px rgba(0,0,0,.5);
    transition:.12s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 13px;line-height:1;}
  .btn.icon{padding:10px;}
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--accent);color:#fff;padding:11px 18px;}
  .btn.dpbtn[data-on="1"]{background:#1F9D55;color:#fff;}
  .ti{width:19px;height:19px;flex:0 0 auto;display:block;}

  .howto{position:relative;z-index:5;flex:0 0 auto;color:#efe8d8;font-size:clamp(12px,2vmin,15px);font-weight:700;background:rgba(14,10,4,.72);border:1px solid rgba(0,220,255,.4);border-radius:999px;padding:6px 16px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;}

  .pinwrap{position:fixed;right:12px;bottom:12px;z-index:7;background:rgba(255,255,255,.96);border-radius:12px;padding:8px;box-shadow:0 8px 20px -8px rgba(0,0,0,.4);display:none;}
  .pinwrap.show{display:block;}
  .pinwrap canvas{width:150px;display:block;border-radius:6px;background:#FBF7EE;}
  .pinwrap .cap{font-size:10px;color:#5a4a7a;text-align:center;margin-top:4px;font-weight:700;}

  @media (prefers-reduced-motion: reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="status" id="status" role="status" aria-live="assertive" data-phase="play">
    <span class="dot" aria-hidden="true"></span><span id="statusText">시작하려면 시작 버튼이나 엔터를 누르세요.</span>
  </div>
  <div class="hud" id="hud">
    <span class="hud-item"><span id="hudStepLbl">걸음</span> <b id="stepN">0</b></span>
    <span class="hud-sep">·</span>
    <span class="hud-item" id="hudGoal">출구: 오른쪽 아래</span>
  </div>
  <div class="maze-area">
    <div class="maze" id="maze" role="group" aria-label="미로. 방향키로 한 칸씩 이동해 출구를 찾으세요."></div>
  </div>
  <div class="howto" id="howtoText">방향키 이동 · C 방향 · G 출구 안내 · H 도움말 · N 새 미로</div>
  <div class="controls">
    <div class="ctl-row">
      <button id="help" class="btn" type="button" aria-label="게임 방법 듣기"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2 -3 3 -3 3"/><path d="M12 17h.01"/></svg><span id="helpLbl">게임 방법</span></button>
      <button id="where" class="btn" type="button"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-4 -4 -7 -7 -7 -11a7 7 0 0 1 14 0c0 4 -3 7 -7 11"/><circle cx="12" cy="10" r="2.5"/></svg><span id="whereLbl">방향 안내</span></button>
      <button id="guide" class="btn" type="button"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l0 3M12 18l0 3M3 12l3 0M18 12l3 0"/><path d="M12 8l4 4l-4 4l-4 -4z"/></svg><span id="guideLbl">출구 안내</span></button>
      <button id="sound" class="btn icon" aria-pressed="true" aria-label="음성 켜짐, 누르면 끔" type="button"></button>
      <button id="dpBtn" class="btn dpbtn" data-on="0" type="button"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8l10 8l-5 4v-16l5 4l-10 8"/></svg><span id="dpLbl">닷패드 연결</span></button>
      <button id="pinToggle" class="btn icon" type="button" aria-pressed="false" aria-label="닷패드 핀 화면 미리보기"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h.01M12 5h.01M19 5h.01M5 12h.01M12 12h.01M19 12h.01M5 19h.01M12 19h.01M19 19h.01"/></svg></button>
    </div>
    <button id="newgame" class="btn btn-primary" type="button"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg><span id="newLbl">시작</span></button>
  </div>
</div>

<div class="pinwrap" id="pinwrap">
  <canvas id="pin" aria-hidden="true"></canvas>
  <div class="cap">실제 핀 출력 (60×40)</div>
</div>

<script src="/tts.js"></script>
<script>
(function(){
  "use strict";
  const N=60,M=40;
  const C=7, R=5;                 // 미로 셀 7x5
  const W=2*C+1, H=2*R+1;         // 비트맵 15x11 (벽 포함)
  const SX=4, SY=3, OFFX=0, OFFY=3; // 핀 스케일/오프셋 (15*4=60, 11*3=33, 세로 중앙)
  const B_NUM=0x3C,B_SP=0x00,B_DIG={'0':0x35,'1':0x01,'2':0x03,'3':0x09,'4':0x19,'5':0x11,'6':0x0B,'7':0x1B,'8':0x13,'9':0x0A};

  const params=new URLSearchParams(location.search);
  if(params.get('embed')==='1') document.body.classList.add('embed');
  const LANG=(params.get('lang')==='en')?'en':'ko';
  const S=(ko,en)=>LANG==='en'?en:ko;

  let bmp=[], pc=0, pr=0, steps=0, over=true, busy=false, soundOn=true, firstGame=true;
  let sdk=null,scanner=null,KeyCodes=null,DataCodes=null,dpConnected=false, ac=null;

  const statusEl=document.getElementById('status'), statusText=document.getElementById('statusText');
  const mazeEl=document.getElementById('maze');
  const soundBtn=document.getElementById('sound'), newBtn=document.getElementById('newgame'), dpBtn=document.getElementById('dpBtn');
  const helpBtn=document.getElementById('help'), whereBtn=document.getElementById('where'), guideBtn=document.getElementById('guide'), pinToggle=document.getElementById('pinToggle'), pinwrap=document.getElementById('pinwrap');
  const pin=document.getElementById('pin'), pctx=pin.getContext('2d');
  const mzCells=[];

  function speak(t){ if(soundOn && window.TW_TTS) TW_TTS.speak(t); }
  if(window.TW_TTS){ TW_TTS.setLang(LANG); }
  function ensureAudio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac&&ac.state==='suspended'){ try{ac.resume();}catch(e){} } }
  function beep(freq,dur,type){ if(!soundOn||!ac)return; try{const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime;
    o.type=type||'sine';o.frequency.value=freq;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.28,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dur+0.02);}catch(e){} }

  // ---- maze generation (DFS) ----
  function genMaze(){
    bmp=Array.from({length:H},()=>new Uint8Array(W).fill(1)); // 1=벽
    const vis=Array.from({length:R},()=>new Array(C).fill(false));
    const bx=c=>2*c+1, by=r=>2*r+1;
    const stack=[[0,0]]; vis[0][0]=true; bmp[by(0)][bx(0)]=0;
    while(stack.length){
      const [c,r]=stack[stack.length-1];
      const nb=[];
      if(r>0&&!vis[r-1][c])nb.push([c,r-1]); if(r<R-1&&!vis[r+1][c])nb.push([c,r+1]);
      if(c>0&&!vis[r][c-1])nb.push([c-1,r]); if(c<C-1&&!vis[r][c+1])nb.push([c+1,r]);
      if(nb.length){ const [nc,nr]=nb[(Math.random()*nb.length)|0];
        bmp[(by(r)+by(nr))/2][(bx(c)+bx(nc))/2]=0; bmp[by(nr)][bx(nc)]=0; vis[nr][nc]=true; stack.push([nc,nr]); }
      else stack.pop();
    }
  }
  const openBetween=(c,r,dc,dr)=>{ const nc=c+dc,nr=r+dr; if(nc<0||nc>=C||nr<0||nr>=R)return false;
    return bmp[(2*r+1)+dr][(2*c+1)+dc]===0; };
  function openDirs(c,r){ const o=[]; if(openBetween(c,r,0,-1))o.push(S('위','up')); if(openBetween(c,r,0,1))o.push(S('아래','down'));
    if(openBetween(c,r,-1,0))o.push(S('왼쪽','left')); if(openBetween(c,r,1,0))o.push(S('오른쪽','right')); return o; }
  function dirsText(c,r){ const o=openDirs(c,r); if(!o.length)return S('막다른 길이에요.','Dead end.');
    return S('갈 수 있는 방향은 '+o.join(', ')+'.', 'You can go '+o.join(', ')+'.'); }
  const posText=(c,r)=>S((r+1)+'행 '+(c+1)+'열', ('row '+(r+1)+' column '+(c+1)));

  // ---- tactile frame ----
  function buildFrame(){
    const g=Array.from({length:M},()=>new Uint8Array(N));
    const set=(x,y)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&x<N&&y>=0&&y<M)g[y][x]=1;};
    for(let by2=0;by2<H;by2++)for(let bx2=0;bx2<W;bx2++){ if(bmp[by2][bx2]===1){
      for(let y=0;y<SY;y++)for(let x=0;x<SX;x++)set(OFFX+bx2*SX+x, OFFY+by2*SY+y); } }
    // 출구: 셀 중앙 십자 표식 (벽=꽉 찬 블록, 플레이어=작은 점 과 촉각적으로 구분)
    const gx=OFFX+(2*(C-1)+1)*SX, gy=OFFY+(2*(R-1)+1)*SY, gcx=gx+((SX/2)|0), gcy=gy+((SY/2)|0);
    for(let x=gx;x<gx+SX;x++) set(x,gcy);
    for(let y=gy;y<gy+SY;y++) set(gcx,y);
    // 플레이어: 셀 중앙 점
    const px=OFFX+(2*pc+1)*SX, py=OFFY+(2*pr+1)*SY, cx=px+((SX/2)|0), cy=py+((SY/2)|0);
    set(cx,cy);set(cx-1,cy);
    return g;
  }
  const EA=[[0,0],[0,1],[0,2],[0,3],[1,0],[1,1],[1,2],[1,3]];
  function encodeFrame(g){let h='';for(let s=0;s<10;s++)for(let n=0;n<30;n++){let b=0;
    for(let m=0;m<8;m++){const u=EA[m][0],p=EA[m][1];if(g[s*4+p][n*2+u])b|=(1<<m);}h+=(b<16?'0':'')+b.toString(16);}return h;}
  function brailleLine(){const digs=String(steps).split('');const by=[B_NUM];
    for(const d of digs)by.push(B_DIG[d]!=null?B_DIG[d]:B_SP);
    while(by.length<20)by.push(B_SP);return by.slice(0,20).map(b=>(b<16?'0':'')+b.toString(16)).join('');}
  function drawPin(){if(!pinwrap.classList.contains('show'))return;
    const Wp=pin.clientWidth||150,gap=Wp/N,cssH=gap*M,dpr=window.devicePixelRatio||1;const frame=buildFrame();
    pin.style.height=cssH+'px';pin.width=Math.round(Wp*dpr);pin.height=Math.round(cssH*dpr);pctx.setTransform(dpr,0,0,dpr,0,0);pctx.clearRect(0,0,Wp,cssH);
    const rOn=gap*0.34,rOff=gap*0.13;
    for(let y=0;y<M;y++)for(let x=0;x<N;x++){const px=x*gap+gap/2,py=y*gap+gap/2;
      pctx.fillStyle=frame[y][x]?'#211d16':'#d9d3c6';pctx.beginPath();pctx.arc(px,py,frame[y][x]?rOn:rOff,0,6.2832);pctx.fill();}}
  function renderPad(){ if(pinwrap.classList.contains('show')) drawPin();
    if(!dpConnected||!sdk)return;try{sdk.displayGraphicData(encodeFrame(buildFrame()));sdk.displayTextData(brailleLine());}catch(e){}}

  // ---- screen ----
  function buildMazeCells(){ mazeEl.innerHTML='';
    for(let i=0;i<W*H;i++){const d=document.createElement('div');d.className='mz';mazeEl.appendChild(d);mzCells[i]=d;} }
  function render(){
    for(let by2=0;by2<H;by2++)for(let bx2=0;bx2<W;bx2++){const d=mzCells[by2*W+bx2];
      if(bmp[by2][bx2]===1){ const v=((bx2*7+by2*13)%4)+1; d.className='mz wall w'+v; }
      else d.className='mz'; }
    const gi=(2*(R-1)+1)*W+(2*(C-1)+1); mzCells[gi].classList.add('goal');
    const pi=(2*pr+1)*W+(2*pc+1); mzCells[pi].classList.add('player');
    document.getElementById('stepN').textContent=steps;
    drawPin(); renderPad();
  }
  function setStatus(t,phase,doSpeak){ statusText.textContent=t; if(phase)statusEl.dataset.phase=phase; if(doSpeak!==false)speak(t); }

  function tutorial(){ speak(S(
    '닷 미로예요. 시작은 왼쪽 위 구석, 출구는 오른쪽 아래 구석이에요. 방향키로 한 칸씩 움직여요. 벽이 있으면 못 가고 벽이라고 알려줄게요. 움직일 때마다 갈 수 있는 방향도 말해 줘요. 씨 키는 지금 갈 수 있는 방향, 그리고 길이 헷갈리면 지 키를 누르세요. 출구까지 몇 칸 남았는지, 다음에 어느 쪽으로 갈지 알려줄게요. 에이치는 도움말이에요. 출구에 도착하면 이겨요. 자, 방향키로 천천히 시작해 보세요.',
    'This is Dot Maze. You start at the top-left corner and the exit is at the bottom-right. Move one cell at a time with the arrow keys. Walls block you and I will say "wall". Each move I also tell you which ways are open. Press C for open directions, and if you get lost press G: I will tell you the shortest distance to the exit and which way to go next. H is help. Reach the exit to win. Take your time with the arrow keys.'
  )); }

  function announceMove(blocked){ if(blocked){ beep(150,0.16,'square'); speak(S('벽이에요. 그쪽은 막혔어요.','Wall. That way is blocked.')); return; }
    beep(560,0.08); speak(posText(pc,pr)+'. '+dirsText(pc,pr)); }
  function move(dc,dr){ if(over||busy)return; ensureAudio();
    if(!openBetween(pc,pr,dc,dr)){ announceMove(true); return; }
    pc+=dc; pr+=dr; steps++; render();
    if(pc===C-1&&pr===R-1){ win(); return; }
    announceMove(false); }
  function win(){ over=true; busy=true; beep(523,0.14);setTimeout(()=>beep(659,0.14),140);setTimeout(()=>beep(784,0.26),280);
    setStatus(S('출구 도착! '+steps+'걸음 만에 탈출 성공! 다시 하려면 시작을 누르세요.','You reached the exit! Escaped in '+steps+' steps! Press start to play again.'),'over');
    padPulse(); }
  function whereAmI(){ speak(posText(pc,pr)+'. '+dirsText(pc,pr)); }
  function bfsToGoal(){ // 현재→출구 최단경로: {dist, dir:[dc,dr] 첫 걸음}
    const seen=Array.from({length:R},()=>new Array(C).fill(-1));
    const prev=Array.from({length:R},()=>new Array(C).fill(null));
    const q=[[pc,pr]]; seen[pr][pc]=0;
    while(q.length){ const [c,r]=q.shift();
      for(const [dc,dr] of [[0,-1],[0,1],[-1,0],[1,0]]) if(openBetween(c,r,dc,dr)&&seen[r+dr][c+dc]<0){
        seen[r+dr][c+dc]=seen[r][c]+1; prev[r+dr][c+dc]=[c,r,dc,dr]; q.push([c+dc,r+dr]); } }
    if(seen[R-1][C-1]<0) return null;
    let cx=C-1, cy=R-1, first=null; const dist=seen[R-1][C-1];
    while(prev[cy][cx]){ const [pcx,pcy,dc,dr]=prev[cy][cx]; if(pcx===pc&&pcy===pr) first=[dc,dr]; cx=pcx; cy=pcy; }
    return { dist, dir:first };
  }
  const dirName=(dc,dr)=> dr<0?S('위','up'):dr>0?S('아래','down'):dc<0?S('왼쪽','left'):S('오른쪽','right');
  function guideToExit(){ ensureAudio();
    if(pc===C-1&&pr===R-1){ speak(S('여기가 출구예요! 도착했어요.','This is the exit! You made it.')); return; }
    const gg=bfsToGoal();
    if(!gg||!gg.dir){ speak(S('출구는 오른쪽 아래 구석에 있어요.','The exit is at the bottom-right corner.')); return; }
    beep(500,0.09);
    speak(S('출구까지 최단 '+gg.dist+'칸. 다음은 '+dirName(gg.dir[0],gg.dir[1])+'으로 가세요.',
            'Shortest path to the exit is '+gg.dist+' steps. Next, go '+dirName(gg.dir[0],gg.dir[1])+'.')); }

  function newGame(){ ensureAudio(); genMaze(); pc=0; pr=0; steps=0; over=false; busy=false;
    setStatus(S('새 미로예요. 방향키로 출구를 찾으세요. H는 도움말.','New maze. Find the exit with the arrow keys. H for help.'),'play',false);
    render();
    if(firstGame){ firstGame=false; tutorial(); } else speak(dirsText(pc,pr)); }

  // ---- DotPad ----
  function handleDotPadKey(keyCode){ if(!KeyCodes)return; document.body.classList.add('kbd');
    if(over){ if(keyCode===KeyCodes.KeyFunction1||keyCode===KeyCodes.LPF1) newGame(); return; }
    switch(keyCode){
      case KeyCodes.KeyFunction1: move(0,-1); break;   // 위
      case KeyCodes.KeyFunction2: move(0,1); break;    // 아래
      case KeyCodes.KeyFunction3: move(-1,0); break;   // 왼쪽
      case KeyCodes.KeyFunction4: move(1,0); break;    // 오른쪽
      case KeyCodes.PanningAll: tutorial(); break;
      case KeyCodes.PanningLeft: whereAmI(); break;
      case KeyCodes.PanningRight: guideToExit(); break;
      case KeyCodes.LPF1: newGame(); break;
    } }
  function wait(ms){return new Promise(r=>setTimeout(r,ms));}
  async function padPulse(){ if(!dpConnected||!sdk)return;try{for(let i=0;i<3;i++){sdk.displayAllUp&&sdk.displayAllUp();await wait(80);sdk.displayAllDown&&sdk.displayAllDown();await wait(60);}renderPad();}catch(e){}}
  async function loadSDK(){ try{ const m=await import('./dotpad-sdk/DotPadSDK-3.0.0.js');
    KeyCodes=m.KeyCodes;DataCodes=m.DataCodes;sdk=new m.DotPadSDK();scanner=new m.DotPadScanner();
    sdk.setCallBack((device,code)=>{ if(code===DataCodes.Connected){dpConnected=true;setDpUI(true);
        setTimeout(()=>{try{sdk.displayAllDown();setTimeout(renderPad,300);}catch(e){}},200);}
      else if(code===DataCodes.Disconnected){dpConnected=false;setDpUI(false);}},
      (device,keyCode)=>handleDotPadKey(keyCode)); return true;}catch(e){return false;} }
  function setDpUI(on){ dpBtn.dataset.on=on?'1':'0'; document.getElementById('dpLbl').textContent=on?S('닷패드 연결됨','DotPad connected'):S('닷패드 연결','Connect DotPad');
    if(on)speak(S('닷패드가 연결됐어요. 벽은 볼록하게 올라와요. F1 위, F2 아래, F3 왼쪽, F4 오른쪽으로 움직이세요.','DotPad connected. Walls are raised. Move with F1 up, F2 down, F3 left, F4 right.')); }
  async function connectDotPad(){
    if(!navigator.bluetooth){ setStatus(S('이 브라우저는 블루투스를 지원하지 않아요. 크롬이나 엣지에서 열어 주세요.','This browser does not support Bluetooth. Please use Chrome or Edge.'),'',true); return; }
    if(!sdk){ loadSDK(); setStatus(S('닷패드 준비 중이에요. 잠시 후 한 번 더 눌러 주세요.','Preparing DotPad. Please tap once more in a moment.'),'',true); return; }
    try{ let dev=null;
      try{ dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'DotPad'},{namePrefix:'KM2-'},{namePrefix:'KM3-'},{namePrefix:'DPK'},{namePrefix:'DMI'}],optionalServices:[scanner.DOTPAD_SERVICE]}); }
      catch(e){ if(e.name==='NotFoundError'){ dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[scanner.DOTPAD_SERVICE]}); } else throw e; }
      if(dev){ setStatus(S('닷패드에 연결 중…','Connecting to DotPad…'),'',false); await sdk.connectBleDevice(dev); }
    }catch(e){ if(e.name!=='NotFoundError') setStatus(S('닷패드 연결 실패: ','DotPad connection failed: ')+(e.message||e.name),'',false); }
  }

  // ---- input ----
  document.addEventListener('keydown',(ev)=>{ const k=ev.key; document.body.classList.add('kbd');
    if(k==='ArrowUp'){move(0,-1);ev.preventDefault();return;}
    if(k==='ArrowDown'){move(0,1);ev.preventDefault();return;}
    if(k==='ArrowLeft'){move(-1,0);ev.preventDefault();return;}
    if(k==='ArrowRight'){move(1,0);ev.preventDefault();return;}
    if(k==='Enter'||k===' '){ if(over){newGame();} ev.preventDefault(); return; }
    if(k==='c'||k==='C'){ whereAmI(); ev.preventDefault(); return; }
    if(k==='g'||k==='G'){ guideToExit(); ev.preventDefault(); return; }
    if(k==='h'||k==='H'||k==='?'){ tutorial(); ev.preventDefault(); return; }
    if(k==='n'||k==='N'){ newGame(); ev.preventDefault(); return; }
  });

  const SVG_VOL='<svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 8a5 5 0 0 1 0 8"/><path d="M17.7 5a9 9 0 0 1 0 14"/><path d="M6 15h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l3.5 -4.5a.8 .8 0 0 1 1.5 .5v14a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5"/></svg>';
  const SVG_VOL_OFF='<svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 8a5 5 0 0 1 1.912 4.934m-1.377 2.602a5 5 0 0 1 -.535 .464"/><path d="M17.7 5a9 9 0 0 1 2.362 11.086m-1.676 2.299a9 9 0 0 1 -.686 .615"/><path d="M9.069 5.054l.431 -.554a.8 .8 0 0 1 1.5 .5v2m0 4v8a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l1.294 -1.664"/><path d="M3 3l18 18"/></svg>';
  soundBtn.innerHTML=SVG_VOL;
  soundBtn.addEventListener('click',()=>{ soundOn=!soundOn; soundBtn.setAttribute('aria-pressed',String(soundOn));
    soundBtn.innerHTML=soundOn?SVG_VOL:SVG_VOL_OFF; soundBtn.setAttribute('aria-label',soundOn?S('음성 켜짐, 누르면 끔','Sound on, tap to mute'):S('음성 꺼짐, 누르면 켬','Sound off, tap to unmute'));
    if(soundOn)speak(S('소리를 켰어요.','Sound on.')); else if(window.TW_TTS)TW_TTS.stop(); });
  newBtn.addEventListener('click',newGame);
  helpBtn.addEventListener('click',tutorial);
  whereBtn.addEventListener('click',whereAmI);
  guideBtn.addEventListener('click',guideToExit);
  dpBtn.addEventListener('click',connectDotPad);
  pinToggle.addEventListener('click',()=>{const on=pinwrap.classList.toggle('show');pinToggle.setAttribute('aria-pressed',String(on));if(on)drawPin();});
  window.addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(drawPin,150);});
  window.getDotpadFrame=()=>encodeFrame(buildFrame());

  if(LANG==='en'){ document.documentElement.lang='en'; document.title='DOT MAZE';
    document.getElementById('newLbl').textContent='Start'; document.getElementById('helpLbl').textContent='How to play';
    document.getElementById('whereLbl').textContent='Directions'; document.getElementById('guideLbl').textContent='Exit guide'; document.getElementById('dpLbl').textContent='Connect DotPad';
    document.getElementById('hudStepLbl').textContent='Steps'; document.getElementById('hudGoal').textContent='Exit: bottom-right';
    document.getElementById('howtoText').textContent='Arrows move · C directions · G exit guide · H help · N new';
    setStatus('Press start or Enter to begin.','play',false); }
  else { setStatus('시작하려면 시작 버튼이나 엔터를 누르세요.','play',false); }
  buildMazeCells(); genMaze(); render(); loadSDK();
  if(params.get('preview')==='1'){ pinwrap.classList.add('show'); pinToggle.setAttribute('aria-pressed','true'); drawPin(); }
  document.addEventListener('pointerdown',()=>document.body.classList.remove('kbd'));
  document.body.addEventListener('pointerdown',function once(){ ensureAudio(); try{speechSynthesis.resume();}catch(e){} document.body.removeEventListener('pointerdown',once); },{once:true});
})();
</script>
</body>
