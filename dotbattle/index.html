<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>닷 배틀십 · DOT BATTLESHIP</title>
<style>
  :root{ --accent:#FF4F00; --ink:#eaf1fb; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;color:var(--ink);overflow:hidden;}

  /* .stage 배경: 지금은 바다 그라데이션. 배경 이미지(assets/bg.webp) 주시면 여기에 center/cover 로 넣습니다. */
  .stage{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,#12406e 0%,#0c2c4d 55%,#071d34 100%);}

  .status{position:absolute;top:4%;left:50%;transform:translateX(-50%);z-index:5;
    background:#fff;border:3px solid #FFC400;border-radius:16px;color:#0b1f38;
    padding:9px 18px;font-size:clamp(14px,2.6vmin,20px);font-weight:800;white-space:nowrap;max-width:94%;
    display:flex;align-items:center;gap:10px;box-shadow:0 6px 18px -6px rgba(0,0,0,.6);}
  .status .dot{width:14px;height:14px;border-radius:50%;background:#8fb3d6;flex:0 0 auto;}
  .status[data-phase="play"] .dot{background:#3FA0EC;}
  .status[data-phase="over"] .dot{background:#2ecc71;}

  .board-wrap{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);
    display:grid;grid-template-columns:auto min(86vmin,520px);grid-template-rows:auto auto;gap:4px;}
  .corner{}
  .col-labels{grid-column:2;grid-row:1;display:grid;grid-template-columns:repeat(5,1fr);gap:min(1.8vmin,10px);padding:0 min(1.8vmin,11px);}
  .row-labels{grid-column:1;grid-row:2;display:grid;grid-template-rows:repeat(5,1fr);gap:min(1.8vmin,10px);padding:min(1.8vmin,11px) 0;}
  .col-labels span,.row-labels span{display:flex;align-items:center;justify-content:center;font-size:clamp(13px,2.4vmin,18px);font-weight:800;color:#dbe9f8;}
  .row-labels span{padding-right:8px;}
  .board{grid-column:2;grid-row:2;
    width:min(86vmin,520px);aspect-ratio:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);
    gap:min(1.8vmin,10px);background:rgba(4,18,34,.6);padding:min(1.8vmin,11px);border-radius:14px;
    box-shadow:0 14px 30px -14px rgba(0,0,0,.7);}
  .hud{position:absolute;top:14%;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;
    background:rgba(9,26,45,.82);border:2px solid #3f74a6;border-radius:999px;padding:8px 18px;font-size:clamp(13px,2.2vmin,17px);font-weight:800;color:#eaf4ff;max-width:94%;}
  .hud b{color:#FFD54A;}
  .hud-sep{color:#5f86ad;}
  .hud-ships{display:inline-flex;gap:7px;flex-wrap:wrap;}
  .chip{display:inline-flex;align-items:center;gap:4px;background:rgba(63,160,236,.28);border:1.5px solid #4f8fc8;border-radius:9px;padding:3px 10px;font-size:clamp(12px,1.9vmin,15px);}
  .chip.sunk{background:rgba(46,204,113,.3);border-color:#2ecc71;color:#c9f7d8;text-decoration:line-through;}
  .howto{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:5;color:#dbe9f8;font-size:clamp(12px,2vmin,15px);font-weight:700;background:rgba(9,26,45,.72);border:1px solid #2c5c88;border-radius:999px;padding:6px 16px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;}
  body.embed .howto{bottom:68px;}
  .cell{-webkit-appearance:none;appearance:none;border:3px solid #3f74a6;background:rgba(41,102,160,.35);
    border-radius:10px;cursor:pointer;padding:0;position:relative;transition:background .12s ease,transform .08s ease;
    display:flex;align-items:center;justify-content:center;}
  .cell:hover:not(:disabled){background:rgba(63,160,236,.4);}
  .cell.cursor{outline:0;box-shadow:0 0 0 4px #0b1f38,0 0 0 9px #FFC400;transform:scale(1.05);z-index:2;}
  .cell.miss{background:rgba(20,44,72,.6);}
  .cell.miss::after{content:"";width:34%;height:34%;border-radius:50%;background:#e9f2fb;box-shadow:0 0 8px rgba(255,255,255,.6);}
  .cell.hit{background:#E53935;border-color:#ff8a87;}
  .cell.hit::after{content:"";width:56%;height:56%;border-radius:6px;background:#fff;box-shadow:0 0 12px #ffd;}
  .cell.sunk{background:#8e1414;border-color:#ff5a55;}
  .cell:disabled{cursor:default;}

  .controls{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);
    z-index:6;display:flex;flex-direction:column;align-items:center;gap:9px;max-width:96vw;}
  .ctl-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;}
  .btn{font-family:inherit;font-size:12px;font-weight:800;border-radius:13px;border:0;cursor:pointer;
    background:rgba(255,255,255,.95);color:#183153;box-shadow:0 5px 13px -6px rgba(0,0,0,.5);
    transition:.12s ease;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 12px;line-height:1;}
  .btn.icon{padding:9px;}
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--accent);color:#fff;padding:10px 16px;}
  .btn.dpbtn[data-on="1"]{background:#1F9D55;color:#fff;}
  .ti{width:18px;height:18px;flex:0 0 auto;display:block;}

  .pinwrap{position:fixed;right:12px;bottom:76px;z-index:6;background:rgba(255,255,255,.96);
    border-radius:12px;padding:8px;box-shadow:0 8px 20px -8px rgba(0,0,0,.4);display:none;}
  .pinwrap.show{display:block;}
  .pinwrap canvas{width:150px;display:block;border-radius:6px;background:#FBF7EE;}
  .pinwrap .cap{font-size:10px;color:#5a4a7a;text-align:center;margin-top:4px;font-weight:700;}

  body.embed .controls{bottom:20px;}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="status" id="status" role="status" aria-live="assertive" data-phase="play">
    <span class="dot" aria-hidden="true"></span><span id="statusText">시작하려면 시작 버튼이나 엔터를 누르세요.</span>
  </div>
  <div class="hud" id="hud">
    <span class="hud-item"><span id="hudSunkLbl">격침</span> <b id="sunkN">0</b>/<span id="totN">3</span></span>
    <span class="hud-sep">·</span>
    <span class="hud-item"><span id="hudShotLbl">발사</span> <b id="shotN">0</b></span>
    <span class="hud-ships" id="shipLegend"></span>
  </div>
  <div class="board-wrap">
    <div class="corner" aria-hidden="true"></div>
    <div class="col-labels" id="colLabels" aria-hidden="true"></div>
    <div class="row-labels" id="rowLabels" aria-hidden="true"></div>
    <div class="board" id="board" role="group" aria-label="배틀십 5행 5열 바다. 방향키로 이동, 엔터로 발사."></div>
  </div>
  <div class="howto" id="howtoText">방향키 이동 · 스페이스 발사 · C 현재 칸 · R 남은 배 · B 판 읽기 · H 도움말</div>
</div>

<div class="controls">
  <div class="ctl-row">
    <button id="help" class="btn" type="button" aria-label="게임 방법 듣기"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2 -3 3 -3 3"/><path d="M12 17h.01"/></svg><span id="helpLbl">게임 방법</span></button>
    <button id="read" class="btn" type="button"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 8a5 5 0 0 1 0 8"/><path d="M6 15h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l3.5 -4.5a.8 .8 0 0 1 1.5 .5v14a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5"/></svg><span id="readLbl">현황 듣기</span></button>
    <button id="sound" class="btn icon" aria-pressed="true" aria-label="음성 켜짐, 누르면 끔" type="button"></button>
    <button id="dpBtn" class="btn dpbtn" data-on="0" type="button"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8l10 8l-5 4v-16l5 4l-10 8"/></svg><span id="dpLbl">닷패드 연결</span></button>
    <button id="pinToggle" class="btn icon" type="button" aria-pressed="false" aria-label="닷패드 핀 화면 미리보기"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h.01M12 5h.01M19 5h.01M5 12h.01M12 12h.01M19 12h.01M5 19h.01M12 19h.01M19 19h.01"/></svg></button>
  </div>
  <button id="newgame" class="btn btn-primary" type="button"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg><span id="newLbl">시작</span></button>
</div>

<div class="pinwrap" id="pinwrap">
  <canvas id="pin" aria-hidden="true"></canvas>
  <div class="cap">실제 핀 출력 (60×40)</div>
</div>

<script src="/tts.js"></script>
<script>
(function(){
  "use strict";
  const N=60,M=40, GRID=5, CW=12, CH=8;         // 5x5, 각 칸 12x8 핀
  const SHIPS=[3,2,2];                           // 함선 크기(총 7칸)
  const B_NUM=0x3C,B_SP=0x00,B_DIG={'0':0x35,'1':0x01,'2':0x03,'3':0x09,'4':0x19,'5':0x11,'6':0x0B,'7':0x1B,'8':0x13,'9':0x0A};

  const params=new URLSearchParams(location.search);
  if(params.get('embed')==='1') document.body.classList.add('embed');
  const LANG=(params.get('lang')==='en')?'en':'ko';
  const S=(ko,en)=>LANG==='en'?en:ko;

  let cells=new Array(GRID*GRID).fill(0);        // 0 미확인 / 1 빗나감 / 2 명중
  let ships=[];                                  // {cells:[], size, hits}
  let cursor=0, shots=0, over=true, soundOn=true, busy=false, firstGame=true;
  let sdk=null,scanner=null,KeyCodes=null,DataCodes=null,dpConnected=false;
  let ac=null;

  const statusEl=document.getElementById('status'), statusText=document.getElementById('statusText');
  const boardEl=document.getElementById('board');
  const soundBtn=document.getElementById('sound'), newBtn=document.getElementById('newgame'), dpBtn=document.getElementById('dpBtn');
  const readBtn=document.getElementById('read'), pinToggle=document.getElementById('pinToggle'), pinwrap=document.getElementById('pinwrap');
  const pin=document.getElementById('pin'), pctx=pin.getContext('2d');
  const cellBtns=[];

  function speak(t){ if(soundOn && window.TW_TTS) TW_TTS.speak(t); }
  if(window.TW_TTS){ TW_TTS.setLang(LANG); }
  function ensureAudio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac&&ac.state==='suspended'){ try{ac.resume();}catch(e){} } }
  function beep(freq,dur,type){ if(!soundOn||!ac)return; try{const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime;
    o.type=type||'sine';o.frequency.value=freq;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.3,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dur+0.02);}catch(e){} }

  const rc=(i)=>[(i/GRID|0),(i%GRID)];           // [row,col]
  function coord(i){const[r,c]=rc(i);return S((r+1)+'행 '+(c+1)+'열',('row '+(r+1)+' column '+(c+1)));}
  function shipAt(i){ return ships.find(s=>s.cells.includes(i))||null; }
  function sunkCount(){ return ships.filter(s=>s.hits>=s.size).length; }
  function allSunk(){ return ships.every(s=>s.hits>=s.size); }

  // ---- tactile frame ----
  function buildFrame(){
    const g=Array.from({length:M},()=>new Uint8Array(N));
    const set=(x,y)=>{x=Math.round(x);y=Math.round(y);if(x>=0&&x<N&&y>=0&&y<M)g[y][x]=1;};
    for(let c=0;c<=GRID;c++){const x=Math.min(c*CW,N-1);for(let y=0;y<M;y++)set(x,y);}   // 세로줄
    for(let r=0;r<=GRID;r++){const y=Math.min(r*CH,M-1);for(let x=0;x<N;x++)set(x,y);}   // 가로줄
    for(let i=0;i<GRID*GRID;i++){const[r,c]=rc(i);const x0=c*CW,y0=r*CH,x1=x0+CW-1,y1=y0+CH-1;
      const st=cells[i];
      if(st===2){ for(let y=y0+1;y<=y1-1;y++)for(let x=x0+1;x<=x1-1;x++)set(x,y); }      // 명중: 칸 채움
      else if(st===1){ const mx=x0+(CW>>1),my=y0+(CH>>1); set(mx,my);set(mx-1,my);set(mx+1,my);set(mx,my-1);set(mx,my+1); } // 빗나감: 십자점
      else if(i===cursor && !over){ for(let x=x0+2;x<=x1-2;x++){set(x,y0+2);set(x,y1-2);} for(let y=y0+2;y<=y1-2;y++){set(x0+2,y);set(x1-2,y);} } // 커서: 내부 사각
    }
    return g;
  }
  const EA=[[0,0],[0,1],[0,2],[0,3],[1,0],[1,1],[1,2],[1,3]];
  function encodeFrame(g){let h='';for(let s=0;s<10;s++)for(let n=0;n<30;n++){let b=0;
    for(let m=0;m<8;m++){const u=EA[m][0],p=EA[m][1];if(g[s*4+p][n*2+u])b|=(1<<m);}h+=(b<16?'0':'')+b.toString(16);}return h;}
  function brailleLine(){const digs=String(SHIPS.length-sunkCount()).split('');const by=[B_NUM];
    for(const d of digs)by.push(B_DIG[d]!=null?B_DIG[d]:B_SP);
    while(by.length<20)by.push(B_SP);return by.slice(0,20).map(b=>(b<16?'0':'')+b.toString(16)).join('');}
  function drawPin(){if(!pinwrap.classList.contains('show'))return;
    const W=pin.clientWidth||150,gap=W/N,cssH=gap*M,dpr=window.devicePixelRatio||1;const frame=buildFrame();
    pin.style.height=cssH+'px';pin.width=Math.round(W*dpr);pin.height=Math.round(cssH*dpr);pctx.setTransform(dpr,0,0,dpr,0,0);pctx.clearRect(0,0,W,cssH);
    const rOn=gap*0.34,rOff=gap*0.13;
    for(let y=0;y<M;y++)for(let x=0;x<N;x++){const px=x*gap+gap/2,py=y*gap+gap/2;
      pctx.fillStyle=frame[y][x]?'#211d16':'#d9d3c6';
      pctx.beginPath();pctx.arc(px,py,frame[y][x]?rOn:rOff,0,6.2832);pctx.fill();}}
  function renderPad(){ if(pinwrap.classList.contains('show')) drawPin();
    if(!dpConnected||!sdk)return;try{sdk.displayGraphicData(encodeFrame(buildFrame()));sdk.displayTextData(brailleLine());}catch(e){}}

  // ---- board (screen) ----
  function buildCells(){ boardEl.innerHTML='';
    for(let i=0;i<GRID*GRID;i++){const b=document.createElement('button');b.className='cell';b.type='button';b.dataset.i=i;
      b.addEventListener('click',()=>{ if(over){newGame();return;} cursor=i; sync(false); fire(i); });
      boardEl.appendChild(b); cellBtns[i]=b; } }
  function buildLabels(){
    const cl=document.getElementById('colLabels'), rl=document.getElementById('rowLabels');
    if(cl && !cl.childElementCount){ for(let c=1;c<=GRID;c++){const s=document.createElement('span');s.textContent=c;cl.appendChild(s);} }
    if(rl && !rl.childElementCount){ for(let r=1;r<=GRID;r++){const s=document.createElement('span');s.textContent=r;rl.appendChild(s);} }
  }
  function updateHud(){
    const sn=document.getElementById('sunkN'), tn=document.getElementById('totN'), shn=document.getElementById('shotN'), lg=document.getElementById('shipLegend');
    if(sn)sn.textContent=sunkCount(); if(tn)tn.textContent=SHIPS.length; if(shn)shn.textContent=shots;
    if(lg){ lg.innerHTML=''; for(const s of ships){ const c=document.createElement('span'); c.className='chip'+(s.hits>=s.size?' sunk':'');
      c.textContent=(LANG==='en'?String(s.size):(s.size+'칸')); lg.appendChild(c); } }
  }
  function cellName(i){const st=cells[i];return st===2?S('맞힌 칸','hit'):st===1?S('빗나간 칸','miss'):S('아직 안 쏜 칸','not fired yet');}
  function render(){ for(let i=0;i<GRID*GRID;i++){const b=cellBtns[i],st=cells[i];
      b.classList.toggle('hit',st===2); b.classList.toggle('miss',st===1); b.classList.toggle('cursor',i===cursor&&!over);
      const sh=st===2?shipAt(i):null; b.classList.toggle('sunk', !!(sh&&sh.hits>=sh.size));
      b.setAttribute('aria-label',coord(i)+', '+cellName(i)+(i===cursor?S(', 현재 위치',', current'):''));
      b.disabled=over||st!==0; }
    updateHud(); drawPin(); renderPad(); }
  function sync(focus){ render(); if(focus!==false&&cellBtns[cursor]&&!cellBtns[cursor].disabled){try{cellBtns[cursor].focus();}catch(e){}} }
  function setStatus(t,phase,doSpeak){ statusText.textContent=t; if(phase)statusEl.dataset.phase=phase; if(doSpeak!==false)speak(t); }

  function moveCursor(dr,dc){ if(over)return; const[r0,c0]=rc(cursor);
    let r=Math.max(0,Math.min(GRID-1,r0+dr)), c=Math.max(0,Math.min(GRID-1,c0+dc));
    if(r===r0&&c===c0){ // 경계에서 막힘 → 어느 끝인지 알려줌
      const edge = dr<0?S('맨 위 줄이에요.','Top row.') : dr>0?S('맨 아래 줄이에요.','Bottom row.') : dc<0?S('맨 왼쪽이에요.','Far left.') : S('맨 오른쪽이에요.','Far right.');
      speak(edge+' '+coord(cursor)+', '+cellName(cursor)+'.'); return; }
    cursor=r*GRID+c; sync(); speak(coord(cursor)+', '+cellName(cursor)+'.'); }

  // ---- placement ----
  function place(){ ships=[]; cells=new Array(GRID*GRID).fill(0); const used=new Set();
    for(const size of SHIPS){ let ok=false,tries=0;
      while(!ok && tries++<200){ const horiz=Math.random()<0.5;
        const r=(Math.random()*(horiz?GRID:GRID-size+1))|0, c=(Math.random()*(horiz?GRID-size+1:GRID))|0;
        const cs=[]; for(let k=0;k<size;k++){ const cc=horiz?(r*GRID+c+k):((r+k)*GRID+c); cs.push(cc); }
        if(cs.some(x=>used.has(x))) continue;
        cs.forEach(x=>used.add(x)); ships.push({cells:cs,size,hits:0}); ok=true; }
    } }

  // ---- fire ----
  function fire(i){ if(over||busy)return; ensureAudio();
    if(cells[i]!==0){ speak(coord(i)+', '+S('이미 쏜 곳이에요. 다른 칸을 골라요.','already fired. Pick another cell.')); return; }
    shots++; const sh=shipAt(i);
    if(sh){ cells[i]=2; sh.hits++;
      if(sh.hits>=sh.size){
        if(allSunk()){ render(); win(); return; }
        beep(660,0.14);setTimeout(()=>beep(880,0.2),120);
        setStatus(coord(i)+', '+S('명중, 배 한 척 격침! ','Hit and sunk a ship! ')+remainMsg(),'play');
      } else { beep(720,0.16); setStatus(coord(i)+', '+S('명중이에요! ','Hit! ')+remainMsg(),'play'); }
    } else { cells[i]=1; beep(200,0.16,'triangle'); setStatus(coord(i)+', '+S('빗나감. 계속 찾아봐요.','Miss. Keep hunting.'),'play'); }
    render(); }
  function win(){ over=true; busy=true; for(const b of cellBtns)b.disabled=true;
    beep(523,0.15);setTimeout(()=>beep(659,0.15),150);setTimeout(()=>beep(784,0.28),300);
    setStatus(S('모든 배를 격침했어요! '+shots+'번 만에 성공. 다시 하려면 시작을 누르세요.',
               'All ships sunk! You won in '+shots+' shots. Press start to play again.'),'over');
    padPulse(); }

  function remainMsg(){ const left=SHIPS.length-sunkCount(); return S('배 '+left+'척 남았어요.','('+left+' left.)'); }
  function tutorial(){ speak(S(
    '닷 배틀십이에요. 다섯 칸씩 다섯 줄, 바다에 배 세 척이 숨어 있어요. 방향키로 칸을 옮기면 지금 위치를 말해 드려요. 스페이스나 엔터를 누르면 그 칸에 발사합니다. 배가 있으면 명중, 배의 칸을 모두 맞히면 격침이에요. 세 척을 다 격침하면 이겨요. 아무 때나 H는 이 설명 다시, C는 지금 위치, R은 남은 배, B는 판 전체 읽기, N은 새 게임이에요. 자, 방향키로 천천히 시작해 보세요.',
    'Dot Battleship. Three ships hide in a five by five sea. Use the arrow keys to move and I will tell you your position. Press Space or Enter to fire at that cell. A ship there is a hit; hit all its cells to sink it. Sink all three to win. Anytime: H repeats this, C says your position, R the ships left, B reads the whole board, N starts a new game. Take your time and use the arrow keys to begin.')); }
  function readBoard(){ let out=S('판 상태입니다. ','Board. ');
    for(let r=0;r<GRID;r++){ const row=[]; for(let c=0;c<GRID;c++) row.push(cellName(r*GRID+c));
      out+=S((r+1)+'행, ','row '+(r+1)+', ')+row.join(', ')+'. '; }
    speak(out); }
  function readStatus(){ speak(S('배 '+SHIPS.length+'척 중 '+sunkCount()+'척 격침. 지금까지 '+shots+'번 발사.',
                                  sunkCount()+' of '+SHIPS.length+' ships sunk. '+shots+' shots so far.')); }
  function readCell(){ speak(coord(cursor)+', '+cellName(cursor)+'.'); }
  function overview(){ tutorial(); }

  function newGame(){ ensureAudio(); place(); cursor=0; shots=0; over=false; busy=false;
    setStatus(S('방향키로 이동, 엔터로 발사. H는 도움말.','Arrows move, Enter fires. H for help.'),'play',false);
    sync();
    if(firstGame){ firstGame=false; tutorial(); }
    else speak(S('새 게임. 방향키로 옮기고 발사하세요.','New game. Move and fire.')); }

  // ---- DotPad ----
  function handleDotPadKey(keyCode){ if(!KeyCodes)return; document.body.classList.add('kbd');
    if(over){ if(keyCode===KeyCodes.KeyFunction1||keyCode===KeyCodes.LPF1) newGame(); return; }
    switch(keyCode){
      case KeyCodes.PanningRight: { let n=Math.min(GRID*GRID-1,cursor+1); cursor=n; sync(); speak(coord(cursor)+', '+cellName(cursor)+'.'); break; }
      case KeyCodes.PanningLeft:  { let n=Math.max(0,cursor-1); cursor=n; sync(); speak(coord(cursor)+', '+cellName(cursor)+'.'); break; }
      case KeyCodes.KeyFunction1: fire(cursor); break;
      case KeyCodes.KeyFunction2: readCell(); break;
      case KeyCodes.KeyFunction3: readStatus(); break;
      case KeyCodes.KeyFunction4: readBoard(); break;
      case KeyCodes.PanningAll: tutorial(); break;
      case KeyCodes.LPF1: newGame(); break;
    } }
  function wait(ms){return new Promise(r=>setTimeout(r,ms));}
  async function padPulse(){ if(!dpConnected||!sdk)return; try{ for(let i=0;i<3;i++){ sdk.displayAllUp&&sdk.displayAllUp(); await wait(80); sdk.displayAllDown&&sdk.displayAllDown(); await wait(60);} renderPad();}catch(e){} }
  async function loadSDK(){ try{ const m=await import('./dotpad-sdk/DotPadSDK-3.0.0.js');
    KeyCodes=m.KeyCodes;DataCodes=m.DataCodes;sdk=new m.DotPadSDK();scanner=new m.DotPadScanner();
    sdk.setCallBack((device,code)=>{ if(code===DataCodes.Connected){dpConnected=true;setDpUI(true);
        setTimeout(()=>{try{sdk.displayAllDown();setTimeout(renderPad,300);}catch(e){}},200);}
      else if(code===DataCodes.Disconnected){dpConnected=false;setDpUI(false);}},
      (device,keyCode)=>handleDotPadKey(keyCode)); return true;}catch(e){return false;} }
  function setDpUI(on){ dpBtn.dataset.on=on?'1':'0'; document.getElementById('dpLbl').textContent=on?S('닷패드 연결됨','DotPad connected'):S('닷패드 연결','Connect DotPad');
    if(on)speak(S('닷패드가 연결됐어요. 패닝으로 옮기고 F1로 발사하세요.','DotPad connected. Pan to move and press F1 to fire.')); }
  async function connectDotPad(){
    if(!navigator.bluetooth){ setStatus(S('이 브라우저는 블루투스를 지원하지 않아요. 크롬이나 엣지에서 열어 주세요.','This browser does not support Bluetooth. Please use Chrome or Edge.'),'',true); return; }
    if(!sdk){ loadSDK(); setStatus(S('닷패드 준비 중이에요. 잠시 후 한 번 더 눌러 주세요.','Preparing DotPad. Please tap once more in a moment.'),'',true); return; }
    try{ let dev=null;
      try{ dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'DotPad'},{namePrefix:'KM2-'},{namePrefix:'KM3-'},{namePrefix:'DPK'},{namePrefix:'DMI'}],optionalServices:[scanner.DOTPAD_SERVICE]}); }
      catch(e){ if(e.name==='NotFoundError'){ dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[scanner.DOTPAD_SERVICE]}); } else throw e; }
      if(dev){ setStatus(S('닷패드에 연결 중…','Connecting to DotPad…'),'',false); await sdk.connectBleDevice(dev); }
    }catch(e){ if(e.name!=='NotFoundError') setStatus(S('닷패드 연결 실패: ','DotPad connection failed: ')+(e.message||e.name),'',false); }
  }

  // ---- input ----
  document.addEventListener('keydown',(ev)=>{ const k=ev.key; document.body.classList.add('kbd');
    if(k==='ArrowRight'){moveCursor(0,1);ev.preventDefault();return;}
    if(k==='ArrowLeft'){moveCursor(0,-1);ev.preventDefault();return;}
    if(k==='ArrowUp'){moveCursor(-1,0);ev.preventDefault();return;}
    if(k==='ArrowDown'){moveCursor(1,0);ev.preventDefault();return;}
    if(k==='Enter'||k===' '){ if(over){newGame();}else{fire(cursor);} ev.preventDefault(); return; }
    if(k==='c'||k==='C'){ readCell(); ev.preventDefault(); return; }
    if(k==='r'||k==='R'){ readStatus(); ev.preventDefault(); return; }
    if(k==='h'||k==='H'||k==='?'){ tutorial(); ev.preventDefault(); return; }
    if(k==='b'||k==='B'){ readBoard(); ev.preventDefault(); return; }
    if(k==='n'||k==='N'){ newGame(); ev.preventDefault(); return; }
  });

  const SVG_VOL='<svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 8a5 5 0 0 1 0 8"/><path d="M17.7 5a9 9 0 0 1 0 14"/><path d="M6 15h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l3.5 -4.5a.8 .8 0 0 1 1.5 .5v14a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5"/></svg>';
  const SVG_VOL_OFF='<svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 8a5 5 0 0 1 1.912 4.934m-1.377 2.602a5 5 0 0 1 -.535 .464"/><path d="M17.7 5a9 9 0 0 1 2.362 11.086m-1.676 2.299a9 9 0 0 1 -.686 .615"/><path d="M9.069 5.054l.431 -.554a.8 .8 0 0 1 1.5 .5v2m0 4v8a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l1.294 -1.664"/><path d="M3 3l18 18"/></svg>';
  soundBtn.innerHTML=SVG_VOL;
  soundBtn.addEventListener('click',()=>{ soundOn=!soundOn; soundBtn.setAttribute('aria-pressed',String(soundOn));
    soundBtn.innerHTML=soundOn?SVG_VOL:SVG_VOL_OFF; soundBtn.setAttribute('aria-label',soundOn?S('음성 켜짐, 누르면 끔','Sound on, tap to mute'):S('음성 꺼짐, 누르면 켬','Sound off, tap to unmute'));
    if(soundOn)speak(S('소리를 켰어요.','Sound on.')); else if(window.TW_TTS)TW_TTS.stop(); });
  newBtn.addEventListener('click',newGame);
  readBtn.addEventListener('click',readStatus);
  document.getElementById('help').addEventListener('click',tutorial);
  dpBtn.addEventListener('click',connectDotPad);
  pinToggle.addEventListener('click',()=>{const on=pinwrap.classList.toggle('show');pinToggle.setAttribute('aria-pressed',String(on));if(on)drawPin();});
  window.addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(drawPin,150);});
  window.getDotpadFrame=()=>encodeFrame(buildFrame());

  if(LANG==='en'){ document.documentElement.lang='en'; document.title='DOT BATTLESHIP';
    document.getElementById('newLbl').textContent='Start'; document.getElementById('readLbl').textContent='Status';
    document.getElementById('dpLbl').textContent='Connect DotPad';
    document.getElementById('hudSunkLbl').textContent='Sunk'; document.getElementById('hudShotLbl').textContent='Shots';
    document.getElementById('helpLbl').textContent='How to play';
    document.getElementById('howtoText').textContent='Arrows move · Space fire · C cell · R ships · B read · H help';
    setStatus('Press start or Enter to begin.','play',false); }
  else { setStatus('시작하려면 시작 버튼이나 엔터를 누르세요.','play',false); }
  buildCells(); buildLabels(); place(); render(); loadSDK();
  if(params.get('preview')==='1'){ pinwrap.classList.add('show'); pinToggle.setAttribute('aria-pressed','true'); drawPin(); }
  document.addEventListener('pointerdown',()=>document.body.classList.remove('kbd'));
  document.body.addEventListener('pointerdown',function once(){ ensureAudio(); try{speechSynthesis.resume();}catch(e){} document.body.removeEventListener('pointerdown',once); },{once:true});
})();
</script>
</body>
</html>
